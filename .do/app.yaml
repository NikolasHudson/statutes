name: statutes
region: nyc
features:
- buildpack-stack=ubuntu-22
# Deploy/domain failure notifications (2026-07-14 doctl security review: both
# apps had ZERO alert rules, so a failed deploy or a cert/domain problem was
# silent). App-level alerts email the account owner.
alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
# Custom domain. Without this, re-applying the spec wipes whatever domain
# was attached via the DO panel — that's how we lost corpus.nick.law on
# the first spec re-paste. Keep this in source so the domain is tied to
# the spec, not just the panel state.
domains:
# Tranche 3 (2026-07-13): CUTOVER COMPLETE. app.hudsonlegal.tech is the sole host.
# corpus.nick.law was RETIRED — removed from the app and every allowlist once the
# new host verified live; the app now 404s the old Host. (Deleting the
# corpus.nick.law DNS record itself is a separate Cloudflare cleanup; until then
# the record resolves but the app rejects it.)
- domain: app.hudsonlegal.tech
  type: PRIMARY
databases:
- name: iowa-db
  engine: PG
  production: true
  cluster_name: iowa-db
  db_name: defaultdb
  db_user: doadmin
# Secret values are NOT committed. SECRET_KEY / OPENAI_API_KEY /
# VOYAGE_API_KEY / DOCLING_INTERNAL_TOKEN are set as encrypted env vars on the
# App Platform app. Never commit plaintext here.
#
# WARNING — do NOT `doctl apps update --spec` straight from THIS file. A value-
# less `type: SECRET` does NOT preserve the existing value on update; it
# re-encrypts it to an EMPTY string and the next container boots with
# SECRET_KEY="" (500s on every real request — this took prod login down on
# 2026-06-03). To change the spec safely, start from the LIVE spec which still
# carries the encrypted values:
#   doctl apps spec get <app-id> > /tmp/spec.yaml   # has the EV[...] secrets
#   # edit /tmp/spec.yaml, then:
#   doctl apps update <app-id> --spec /tmp/spec.yaml
# i.e. always apply a spec whose SECRET envs include their EV[...] ciphertext
# (passing the ciphertext back is what actually preserves them). This file is
# the human-readable source of intent only.
#
# DRIFT — reconciled against `doctl apps spec get 61f2fbd2-...` on 2026-07-13.
# The repo file had fallen behind live by three ingress rules (the /admin/usage,
# /admin/users and /admin/articles staff SPA surfaces), so applying it verbatim
# would have 404'd all three. They are restored below. Everything else matched
# live exactly: same app-level env keys, scopes, types and values; all six
# components identical; same domains, databases, region and features.
#
# Two blocks below are deliberately AHEAD of live, and neither is deployed yet:
#   - the /oauth + /.well-known/oauth-* ingress rules (OAuth landed in 341a13c
#     with no route; discovery 404s on prod today), and
#   - the chat-frontend NEXT_PUBLIC_* build envs.
# Both are annotated where they appear. Re-check this drift note whenever you
# diff against live — a spec file that lies is worse than no spec file.
#
# DRIFT 2026-07-14 (doctl security review): a reconciled apply-ready copy of the
# LIVE spec (EV ciphertexts preserved) + this file's additions (PRE_DEPLOY
# migrate job, alerts, MARKETING_LEAD_RETENTION_DAYS, TRUSTED_PROXY_COUNT,
# chat-frontend NEXT_PUBLIC_* build envs) was prepared and structure-validated;
# applying it is gated on Nick (production deploy). EMAIL_TRUSTED_AUTHSERV_IDS
# deliberately NOT included — its value must be read off a real post-cutover
# message first (see the commented env below).
envs:
- key: SECRET_KEY
  scope: RUN_AND_BUILD_TIME
  type: SECRET
- key: OPENAI_API_KEY
  scope: RUN_AND_BUILD_TIME
  type: SECRET
- key: VOYAGE_API_KEY
  scope: RUN_AND_BUILD_TIME
  type: SECRET
# Shared secret authenticating Django -> docling internal calls (#9). The
# Django caller (backend/apps/api/services/extract.py) sends it as a header
# and the docling service (docling-service/app.py) verifies it with
# hmac.compare_digest before doing any work. Declared at app level and scoped
# RUN_TIME so BOTH the statutes caller and the docling verifier receive the
# same value. No plaintext committed — set it once in the App Platform UI.
- key: DOCLING_INTERNAL_TOKEN
  scope: RUN_TIME
  type: SECRET
# Email assistant (apps/mail). Postmark server token for outbound replies via
# anymail; the webhook token authenticates Postmark's inbound POSTs to
# /api/email/inbound?token=... (set the same value in the Postmark webhook
# URL). Both set once in the App Platform UI — never plaintext here.
- key: POSTMARK_SERVER_TOKEN
  scope: RUN_TIME
  type: SECRET
- key: EMAIL_INBOUND_WEBHOOK_TOKEN
  scope: RUN_TIME
  type: SECRET
- key: DATABASE_URL
  scope: RUN_AND_BUILD_TIME
  value: ${iowa-db.DATABASE_URL}
# DB transport security (#22). DO Managed Postgres mandates TLS server-side
# and the bound DATABASE_URL above already carries ?sslmode=require, so the
# connection is encrypted regardless. We set DATABASE_SSLMODE=require
# explicitly so the spec is the source of truth rather than relying on the
# Django default. NOTE: do NOT flip this to verify-full without first shipping
# the DO cluster CA bundle — verify-full authenticates the server cert and a
# missing/wrong CA path will break every prod DB connection. To upgrade later:
#   1. download the cluster CA cert from the DO control panel,
#   2. ship it in the image (or mount it) and set DATABASE_SSLROOTCERT to it,
#   3. flip DATABASE_SSLMODE to verify-full (or verify-ca if the private
#      endpoint hostname mismatches).
# - key: DATABASE_SSLROOTCERT
#   scope: RUN_TIME
#   value: /app/certs/do-ca.crt
- key: DATABASE_SSLMODE
  scope: RUN_TIME
  value: require
- key: DEBUG
  scope: RUN_AND_BUILD_TIME
  value: "False"
# Pin the Host allowlist instead of "*" (#19/#20/#29) to restore Django's
# Host-header validation as defense-in-depth. settings.py parses it as a
# comma-list.
#
# CORRECTION (verified 2026-07-13): ${APP_DOMAIN} is NOT the bare
# .ondigitalocean.app host, as this comment claimed for months. It resolves to
# the PRIMARY CUSTOM DOMAIN. Proof:
#   curl -o /dev/null -w '%{http_code}' https://statutes-ialpt.ondigitalocean.app/admin/login/
#     -> 400   (Django DisallowedHost — the bare host is NOT in ALLOWED_HOSTS)
#   curl -o /dev/null -w '%{http_code}' https://corpus.nick.law/admin/login/
#     -> 200
# So the value below expands to "corpus.nick.law,corpus.nick.law" — the same
# host twice. The bare .ondigitalocean.app host has never been allowed, and the
# app is fine without it (App Platform's health probes reach the container
# directly, not through the edge hostname).
#
# CUTOVER COMPLETE (2026-07-13, Tranche 3): corpus.nick.law retired.
# app.hudsonlegal.tech is PRIMARY, so ${APP_DOMAIN} now resolves to it; it is kept
# as a trailing entry purely for robustness if PRIMARY ever changes again. The
# `mcp` component derives its transport-security allowlist from ALLOWED_HOSTS.
- key: ALLOWED_HOSTS
  scope: RUN_TIME
  value: "app.hudsonlegal.tech,${APP_DOMAIN}"
- key: CSRF_TRUSTED_ORIGINS
  scope: RUN_TIME
  value: https://app.hudsonlegal.tech,https://${APP_DOMAIN}
# Explicit credentialed-CORS allowlist (#21/#34). Without this, prod silently
# falls back to the localhost dev origin in settings.py. Prod is same-origin
# (frontend served at /), so this is hardening/clarity; never combine with a
# wildcard while CORS_ALLOW_CREDENTIALS=True.
- key: CORS_ALLOWED_ORIGINS
  scope: RUN_TIME
  value: https://app.hudsonlegal.tech
# Tranche 3 (2026-07-13): the app's canonical origin, pinned to the new host so
# Stripe return URLs + org-invite links (APP_URL), emailed citation links
# (EMAIL_LINK_BASE_URL) and the MCP OAuth issuer (MCP_OAUTH_ISSUER) all reference
# app.hudsonlegal.tech rather than floating on the request host or the code default
# of corpus.nick.law. All three were previously UNSET in the live spec.
- key: APP_URL
  scope: RUN_TIME
  value: https://app.hudsonlegal.tech
- key: EMAIL_LINK_BASE_URL
  scope: RUN_TIME
  value: https://app.hudsonlegal.tech
- key: MCP_OAUTH_ISSUER
  scope: RUN_TIME
  value: https://app.hudsonlegal.tech
- key: CHAT_DAILY_USER_LIMIT
  scope: RUN_TIME
  value: "50"
- key: CHAT_MONTHLY_GLOBAL_LIMIT
  scope: RUN_TIME
  value: "20000"
# Chat traces hold the user's verbatim question + answer; the trace-purge
# worker deletes rows older than this many days. App-level env, so both the
# Django service and the worker see it.
- key: CHAT_TRACE_RETENTION_DAYS
  scope: RUN_TIME
  value: "7"
# Marketing lead PII retention (SOC2 data-retention gap): contact submissions
# older than the window are deleted; unsubscribed newsletter emails are erased
# once the unsubscribe is that old (active subscribers are never touched). 365
# set 2026-07-14 as the initial policy — adjust freely; 0 disables (retain
# forever). ENFORCEMENT IS NOT SCHEDULED YET: purge_marketing_leads ships in
# the uncommitted security-fix code; after that code is pushed, add a worker
# mirroring trace-purge (`python manage.py purge_marketing_leads --forever`).
# Adding the worker BEFORE the push would crash the deploy — the command does
# not exist on origin/main yet.
- key: MARKETING_LEAD_RETENTION_DAYS
  scope: RUN_TIME
  value: "365"
# RFC 8601 authserv-id pinning for the inbound-mail SPF/DKIM verdicts (see
# core/settings.py). DO NOT GUESS the value — read it off a real POST-CUTOVER
# message's Authentication-Results header (the token before the first ';'):
#   URI=$(doctl databases connection a567f0d2-4a91-4f35-8f60-23f582a30f20 --format URI --no-header)
#   psql "$URI" -t -c "SELECT DISTINCT split_part(h->>'Value',';',1) FROM mail_inboundemail e, jsonb_array_elements(e.raw_payload->'Headers') h WHERE lower(h->>'Name')='authentication-results' AND e.received_at > '2026-07-13';"
# Pre-cutover rows are NOT representative: they carry an authserv-id-less
# header ("spf=pass; dkim=pass …") that cannot be pinned. A WRONG value is
# worse than none — with EMAIL_REQUIRE_SENDER_AUTH on, both verdicts read None
# and every reply is silently refused. Until set, the legacy (spoofable) path
# is used, same as before the fix.
# - key: EMAIL_TRUSTED_AUTHSERV_IDS
#   scope: RUN_TIME
#   value: "<read-off-a-real-message-first>"
# HTTPS enforcement (#39) is layered, no spec directive required: (1) DO App
# Platform terminates TLS and redirects HTTP->HTTPS at the edge for every
# component (including the Next.js frontend at "/"), and (2) Django additionally
# enforces SECURE_SSL_REDIRECT + HSTS when DEBUG is off (backend/core/settings.py)
# for /api and /admin. The frontend ("/") relies on the platform edge, so DO
# App Platform is the control owner for that path; Django HSTS is the durable
# browser-side backstop for the API/admin paths.
#
# Ingress rules are evaluated top-down; first prefix match wins. The Next.js
# chat-frontend serves the entire SPA at "/"; Django keeps /api/* and
# /admin/*. preserve_path_prefix is REQUIRED everywhere — without it App
# Platform strips the matched prefix before forwarding (so /api/auth/login
# would reach Django as /auth/login).
ingress:
  rules:
  # Remote MCP server (streamable HTTP). Path-based routing was a deliberate
  # decision (see MCP_PRODUCTION_PLAN.md §2a): App Platform supports both path
  # and subdomain routing; path reuses this proven pattern with zero new DNS.
  # preserve_path_prefix is REQUIRED — FastMCP's streamable_http_path defaults to
  # /mcp, so the component must see /mcp (not a stripped /). Public endpoint:
  # https://corpus.nick.law/mcp.
  - match:
      path:
        prefix: /mcp
    component:
      name: mcp
      preserve_path_prefix: true
  # MCP OAuth 2.0 authorization server. These landed in 341a13c and the ingress
  # rule was never added, so today they fall into the / catch-all and the chat
  # frontend answers them with a 404 HTML page. Confirmed against live prod:
  #   curl https://corpus.nick.law/.well-known/oauth-authorization-server
  #     -> 404, body is Next.js HTML
  # No client can discover the AS, so no client can connect over OAuth.
  #
  # They route to `statutes`, NOT to `mcp` — and the note this replaces (which
  # said to point them at the mcp component) was wrong. The views are Django
  # views: apps/mcp_server/urls.py is include()d at the ROOT of core/urls.py, and
  # only `statutes` runs that URLConf (gunicorn core.wsgi:application). The `mcp`
  # component overrides the CMD with gunicorn apps.mcp_server.asgi:app, which is
  # build_http_app() — a /healthz short-circuit wrapping X-API-Key auth wrapping
  # FastMCP. It mounts no Django URLConf at all. Exercised directly:
  #   mcp asgi app  GET /healthz                                 -> 200
  #   mcp asgi app  GET /oauth/authorize                         -> 401
  #   mcp asgi app  GET /.well-known/oauth-authorization-server  -> 401
  # i.e. routing discovery at `mcp` would 401 the very requests that must be
  # public — an unauthenticated client fetches these documents precisely to learn
  # how to authenticate. It would look like a working rule and break every connect.
  #
  # The /.well-known prefixes are pinned to the two OAuth documents rather than
  # matching /.well-known wholesale, so nothing else that convention hosts there
  # (ACME challenges at /.well-known/acme-challenge, above all) is diverted into
  # Django. Prefix matching still covers the RFC 9728 §3.1 path-insertion variants
  # (.../oauth-protected-resource/mcp) for free.
  - match:
      path:
        prefix: /.well-known/oauth-authorization-server
    component:
      name: statutes
      preserve_path_prefix: true
  - match:
      path:
        prefix: /.well-known/oauth-protected-resource
    component:
      name: statutes
      preserve_path_prefix: true
  - match:
      path:
        prefix: /oauth
    component:
      name: statutes
      preserve_path_prefix: true
  - match:
      path:
        prefix: /api
    component:
      name: statutes
      preserve_path_prefix: true
  # Staff SPA surfaces. These three live in the Next.js app, not Django admin,
  # and they MUST stay above the /admin rule — rules are evaluated top-down and
  # first prefix match wins, so /admin → statutes would otherwise swallow them and
  # hand all three to Django, which has no such views: a 404 on every staff page.
  #
  # (These exist on the live app but were missing from this file. Applying this
  # spec without them would have taken all three surfaces down.)
  - match:
      path:
        prefix: /admin/usage
    component:
      name: chat-frontend
      preserve_path_prefix: true
  - match:
      path:
        prefix: /admin/users
    component:
      name: chat-frontend
      preserve_path_prefix: true
  - match:
      path:
        prefix: /admin/articles
    component:
      name: chat-frontend
      preserve_path_prefix: true
  - match:
      path:
        prefix: /admin
    component:
      name: statutes
      preserve_path_prefix: true
  # Django admin's static (CSS/JS) is served by WhiteNoise at /static/. When
  # the Next.js chat-frontend took over the / catch-all, /static/* started
  # falling through to it and 404ing — which strips all styling from the
  # admin. Route it back to Django. The frontend doesn't use /static (Next.js
  # assets live under /_next/), so this shadows nothing.
  - match:
      path:
        prefix: /static
    component:
      name: statutes
      preserve_path_prefix: true
  - match:
      path:
        prefix: /
    component:
      name: chat-frontend
      preserve_path_prefix: true
services:
# Django: API + admin only. WhiteNoise serves Django admin's own static.
- name: statutes
  dockerfile_path: /Dockerfile
  source_dir: /
  github:
    repo: NikolasHudson/statutes
    branch: main
    deploy_on_push: true
  http_port: 8080
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb
  # HTTP health check (#30) so App Platform pulls unhealthy instances from
  # rotation and blocks promotion of a broken revision during rolling deploys,
  # instead of falling back to a bare TCP probe. /api/health is the existing
  # Django liveness endpoint (backend/apps/api/api.py).
  health_check:
    http_path: /api/health
    timeout_seconds: 5
    failure_threshold: 3
  envs:
  # Reach the docling extractor over the app's private LAN. PRIVATE_URL is a
  # full http URL with the internal port baked in (e.g. http://docling:8080);
  # the extract client appends /extract. Only this service talks to docling,
  # so the binding lives here rather than at app level.
  - key: DOCLING_SERVICE_URL
    scope: RUN_TIME
    value: ${docling.PRIVATE_URL}
  # -------------------------------------------------------------------------
  # WHO THE CLIENT IS. These three decide the address that the login lockout,
  # the registration throttle, the marketing lead throttle and every audit row
  # key on (backend/apps/accounts/audit.client_ip). Get them wrong and the audit
  # trail records a proxy, and axes' [[ip_address, username]] lockout degenerates
  # to per-username: a handful of failures from anywhere locks any named account.
  #
  # THE TOPOLOGY, verified against live prod on 2026-07-13 (not assumed — the
  # previous "App Platform is a single edge hop" model was assumed, and wrong):
  #
  #     client -> Cloudflare -> DO App Platform edge -> gunicorn
  #
  #   dig +short A corpus.nick.law   -> 104.21.54.137, 172.67.138.250  (CF anycast)
  #   dig +short NS nick.law         -> rick/leanna.ns.cloudflare.com
  #   curl -sI https://corpus.nick.law/api/health
  #       -> server: cloudflare + cf-ray: ...   AND   x-do-app-origin: 7de0b917-...
  #
  # i.e. nick.law is ORANGE-CLOUDED (proxied). That is TWO appending proxies, so
  # X-Forwarded-For arrives as "<client>, <CF egress>" on an honest request and
  # the right-most entry is CLOUDFLARE, never the caller.
  # -------------------------------------------------------------------------
  #
  # CF-Connecting-IP is the control. Cloudflare OVERWRITES it on ingress, so a
  # browser cannot forge it THROUGH CLOUDFLARE, and — unlike a hop count — it does
  # not depend on how many proxies append to the chain. It is trustworthy only
  # while every request reaching client_ip has transited a Cloudflare that
  # overwrote the header. ALLOWED_HOSTS does NOT establish that: the attack is not
  # sending Host: <bare>.ondigitalocean.app (that 400s and no attacker would), it
  # is sending Host: app.hudsonlegal.tech (which IS allowed) straight to the DO
  # origin to skip our CF and forge the header. What forecloses THAT (verified
  # 2026-07-14): a request to statutes-*.ondigitalocean.app carrying
  # Host: app.hudsonlegal.tech is refused 403 at DO's edge (/api/health and
  # /admin/login/ both 403), so it never reaches Django — and the DO edge is
  # itself CF-fronted, so anything that does reach Django was CF-overwritten.
  # This rests on DO edge behavior we neither control nor monitor: add Cloudflare
  # Authenticated Origin Pulls (mTLS) or a CF-injected secret header the origin
  # verifies for a control that does not depend on it, and re-run the 403 probe
  # after any DO/CF topology change.
  #
  # ⚠ VERIFY ON FIRST DEPLOY, one command, before trusting this in anger. Our CF
  # zone proxies to an origin (*.ondigitalocean.app) that is ITSELF Cloudflare-
  # fronted, i.e. a Cloudflare-to-Cloudflare hop. Cloudflare's documented O2O
  # behaviour preserves the visitor's address in CF-Connecting-IP, and that is what
  # this setting bets on — but nothing echoes the origin-side header, so it has NOT
  # been observed from outside. audit.record_event now logs the shape of every
  # auth event, so one real login settles it:
  #     doctl apps logs <app-id> statutes --type run | grep login_success
  #     -> {"source_ip": "<your real IP>", "xff_len": N, "cf_ip": true}
  # If source_ip comes back as a Cloudflare address (172.6x/104.2x) instead of the
  # address you logged in from, CF-Connecting-IP is NOT surviving the O2O hop: set
  # TRUST_CF_CONNECTING_IP=false and set TRUSTED_PROXY_COUNT from the xff_len that
  # same log line reports. Failing that way is no worse than the state this
  # replaces (a proxy address either way) — it is just not yet the fix.
  - key: TRUST_CF_CONNECTING_IP
    scope: RUN_TIME
    value: "true"
  # FALLBACK ONLY — unreachable in prod while TRUST_CF_CONNECTING_IP is true, which
  # is exactly why it is left at the default of 1 rather than "corrected" to 2. A
  # second unverified guess is not an improvement on the first: the honest chain
  # length has never been measured (see the doctl command above). Left low it
  # degrades to a proxy address; set too HIGH it reads an entry the CLIENT typed,
  # and only that direction is a forgery. Do not raise it on a hunch.
  - key: TRUSTED_PROXY_COUNT
    scope: RUN_TIME
    value: "1"
  # Shared secret proving a POST to /api/marketing/* came from the marketing site's
  # own server-side route handlers, which relay leads from a container and so must
  # carry the visitor's address explicitly (X-Real-Client-IP) rather than as a
  # property of the connection. Without it every lead on earth keys to the marketing
  # container's egress IP and shares one throttle bucket.
  #
  # ⚠ THIS WAS MISSING. It was added to .do/marketing-app.yaml and never here — a
  # dropped handoff that made the whole forwarding feature dead on arrival: the
  # backend would read "" , ignore the header, and key every lead on the container.
  #
  # It MUST BE THE SAME STRING as MARKETING_PROXY_TOKEN on the `hudson-marketing`
  # app. Two apps, two separately-encrypted values, one secret. Set it in the App
  # Platform UI on BOTH; never plaintext here. Keep it ASCII (audit.client_ip
  # compares bytes and will simply not match a non-ASCII token — it no longer
  # crashes on one, but it will not authenticate it either).
  #
  # It is not an auth gate: /api/marketing/* is auth=None by design, and a missing
  # or wrong token degrades IP attribution rather than breaking the forms.
  - key: MARKETING_PROXY_TOKEN
    scope: RUN_TIME
    type: SECRET
# Docling extraction microservice: turns uploaded PDF/DOCX into text for the
# Verify Document feature. Internal-only (no ingress, internal_ports) so it's
# never exposed publicly — only the Django service calls it. Carries the
# PyTorch + layout-model weight that we deliberately keep OUT of the API image,
# so it gets its own, larger instance. Bump the size slug if extraction OOMs on
# big briefs.
- name: docling
  dockerfile_path: /docling-service/Dockerfile
  source_dir: /docling-service
  github:
    repo: NikolasHudson/statutes
    branch: main
    deploy_on_push: true
  internal_ports:
  - 8080
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-2gb
  health_check:
    http_path: /health
# Next.js assistant-ui app: the canonical frontend. Lives in /chat-frontend
# in the repo and ships its own Node 20 Dockerfile. Mounted at / by the
# ingress rule above; no basePath since it owns the root.
- name: chat-frontend
  dockerfile_path: /chat-frontend/Dockerfile
  source_dir: /chat-frontend
  github:
    repo: NikolasHudson/statutes
    branch: main
    deploy_on_push: true
  http_port: 8080
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  # HTTP health check (#30): probe the app root so an up-but-broken Next.js
  # process is pulled from rotation rather than relying on a bare TCP probe.
  health_check:
    http_path: /
    timeout_seconds: 5
    failure_threshold: 3
  # NEXT_PUBLIC_* are inlined into the bundle at BUILD and cannot be corrected at
  # runtime, so they must be BUILD_TIME and they must be LITERALS — an App
  # Platform bindable (${APP_DOMAIN}, ${APP_URL}) is runtime-only for a Dockerfile
  # build and arrives at the build as the empty string. chat-frontend/Dockerfile
  # now declares a matching ARG for each; without one, App Platform passes the
  # --build-arg and Docker discards it silently.
  #
  # Neither has ever been set. NEXT_PUBLIC_MARKETING_URL="" means every link from
  # the app back to the marketing site is already dead (components/funnel-chrome.tsx,
  # app/(app)/admin/articles/editor.tsx) — unnoticed only because marketing has
  # never been deployed. NEXT_PUBLIC_APP_URL="" is masked in the browser by
  # lib/brand.ts falling back to window.location, but there is no window during
  # SSR, so server-rendered absolute self-URLs come out relative.
  #
  # ⚠ These two are BAKED AT BUILD, so they cannot be flipped independently of the
  # domain: apply them in the SAME spec update as the `domains:` change above, not
  # before. Set early, the app (still on corpus.nick.law) renders every self-link
  # and marketing link at hosts that do not resolve yet; set late, the app links
  # back to the retired domain. There is no runtime correction for either.
  envs:
  - key: NEXT_PUBLIC_APP_URL
    scope: BUILD_TIME
    value: https://app.hudsonlegal.tech
  - key: NEXT_PUBLIC_MARKETING_URL
    scope: BUILD_TIME
    value: https://hudsonlegal.tech
# Remote MCP server: the same Django image (mcp[cli] is in requirements.txt;
# PyTorch is deliberately NOT — it lives only in docling — so this image is
# small) served as a streamable-HTTP ASGI app instead of the WSGI API. We
# override the Dockerfile CMD with run_command (same mechanism as the
# trace-purge worker) rather than maintaining a second Dockerfile.
#   VERIFY ON FIRST DEPLOY: that run_command overrides the Dockerfile CMD on a
#   *service* (the trace-purge precedent is a *worker*). If it does not, add a
#   dedicated /Dockerfile.mcp with the gunicorn CMD baked in and point
#   dockerfile_path at it.
# Stateless + JSON mode (apps/mcp_server/server.py) makes multi-worker /
# multi-instance safe — App Platform has no session affinity. Inherits the
# app-level envs it needs (SECRET_KEY, DATABASE_URL, DATABASE_SSLMODE,
# VOYAGE_API_KEY, ALLOWED_HOSTS, DEBUG). Transport-security allowed_hosts/origins
# default from ALLOWED_HOSTS/CORS_ALLOWED_ORIGINS; override with
# MCP_ALLOWED_HOSTS / MCP_ALLOWED_ORIGINS, or set
# MCP_DNS_REBINDING_PROTECTION=false as an escape hatch if the edge forwards an
# unexpected Host and 421s every call (auth still gates every request).
# Auth is X-API-Key + per-key tier feature-gate and daily quota (shared with
# the REST API via apps.mcp_server.gating). Durable audit logging of MCP calls
# is still pending — see plan P1.
# NOTE: deploy_on_push couples MCP redeploys to every main commit (whole-app
# deploy); that is accepted, not independent rollout.
- name: mcp
  dockerfile_path: /Dockerfile
  source_dir: /
  github:
    repo: NikolasHudson/statutes
    branch: main
    deploy_on_push: true
  run_command: gunicorn apps.mcp_server.asgi:app -k uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:8080 --timeout 120 --graceful-timeout 120 --access-logfile - --error-logfile -
  http_port: 8080
  instance_count: 1
  # Shared 1vcpu/1gb matches the Django API: rerank is an outbound Voyage HTTP
  # call (no local CPU/torch), so the profile is light. Bump only if observed
  # CPU/latency warrants. Keep instance_count: 1 until a shared store (Valkey)
  # backs cross-instance rate limiting (plan P1).
  instance_size_slug: apps-s-1vcpu-1gb
  # HTTP health check on the auth-exempt, non-streaming GET /healthz (NEVER /mcp,
  # which is POST-only JSON-RPC). Answered before auth in the ASGI wrapper.
  health_check:
    http_path: /healthz
    timeout_seconds: 5
    failure_threshold: 3
# Retention worker: DO App Platform has no native cron, so a long-lived worker
# enforces the chat-trace retention window itself. It reuses the Django image
# and inherits the app-level envs (DATABASE_URL, CHAT_TRACE_RETENTION_DAYS),
# wakes once a day, purges expired traces, and sleeps.
#
# run_command is a single shell-free argv ON PURPOSE. An earlier
# `while true; do ...; sleep; done` form failed every deploy with
# DeployContainerTerminated: the slim runtime image has no bash and App
# Platform did not run the string through a shell, so the loop never executed
# and the container exited immediately. The loop + sleep + per-pass error
# guard now live inside the management command (--forever); see
# backend/apps/api/management/commands/purge_chat_traces.py. Keep this a plain
# argv with no shell operators.
workers:
- name: trace-purge
  dockerfile_path: /Dockerfile
  source_dir: /
  github:
    repo: NikolasHudson/statutes
    branch: main
    deploy_on_push: true
  instance_count: 1
  # 0.5GB is ample: the purge command boots Django (no ML libs) and peaks at
  # ~80MB RSS. The earlier deploy failures were NOT memory (see run_command
  # note above), so there's no reason to pay for a larger slug here.
  instance_size_slug: apps-s-1vcpu-0.5gb
  run_command: python manage.py purge_chat_traces --forever
# Email assistant: drains the inbound-email queue (rows written by the
# /api/email/inbound webhook), runs the chat pipeline headlessly, replies via
# Postmark. Same shell-free-argv rule as trace-purge. 1GB (not 0.5) because a
# turn exercises the full retrieval pipeline (Voyage HTTP embed/rerank — no
# local torch, but the corpus code paths are heavier than the purger).
- name: email-assistant
  dockerfile_path: /Dockerfile
  source_dir: /
  github:
    repo: NikolasHudson/statutes
    branch: main
    deploy_on_push: true
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb
  run_command: python manage.py process_assistant_email --forever
# ---------------------------------------------------------------------------
# Deploy-phase jobs.
# ---------------------------------------------------------------------------
# import-articles syncs backend/content/articles/*.md -> the marketing.Article
# table (idempotent upsert by slug). It is a POST_DEPLOY job so a new article is
# published simply by committing its .md and deploying — the mechanism the
# import_articles command was written for ("safe to run on every deploy") but
# which was never wired up, leaving prod /articles empty. Runs on EVERY deploy;
# because it upserts, re-runs are no-ops ("0 created, 0 updated"). Inherits the
# app-level DATABASE_URL like the workers above.
jobs:
# migrate applies DB schema changes as a PRE_DEPLOY step — BEFORE the new image
# serves traffic — so the schema the new code expects exists when it starts.
# This closes the standing change-management gap: prod migrations were hand-run
# against the live DB (unlogged, easy to forget mid-deploy — the billing paywall
# and several other rollouts each needed a manual `manage.py migrate`). With this
# job, `git push` is the whole deploy again.
#
# CONSTRAINT: keep migrations ADDITIVE / backward-compatible. A PRE_DEPLOY job
# runs while the OLD version is still live, so a destructive migration (dropping
# a column the running code still reads) would break prod for the deploy window.
# Split such changes across two deploys (add-and-backfill, then remove) — the
# standard expand/contract pattern. Inherits the app-level DATABASE_URL.
- name: migrate
  kind: PRE_DEPLOY
  dockerfile_path: /Dockerfile
  source_dir: /
  github:
    repo: NikolasHudson/statutes
    branch: main
    deploy_on_push: true
  instance_size_slug: apps-s-1vcpu-0.5gb
  run_command: python manage.py migrate --noinput
- name: import-articles
  kind: POST_DEPLOY
  dockerfile_path: /Dockerfile
  source_dir: /
  github:
    repo: NikolasHudson/statutes
    branch: main
    deploy_on_push: true
  instance_size_slug: apps-s-1vcpu-0.5gb
  run_command: python manage.py import_articles
# seed-assistant-address exists on the LIVE app (added during the 2026-07-13
# mail cutover) but was never recorded here — restored 2026-07-14 so applying
# this file's intent doesn't silently drop it. Idempotent upsert of the
# flagship assistant address + its sender allowlist; re-runs are no-ops.
- name: seed-assistant-address
  kind: POST_DEPLOY
  dockerfile_path: /Dockerfile
  source_dir: /
  github:
    repo: NikolasHudson/statutes
    branch: main
    deploy_on_push: true
  instance_size_slug: apps-s-1vcpu-0.5gb
  run_command: python manage.py seed_assistant_address --address assistant@hudsonlegal.tech --allow nick@nickhudson.me --allow nick@nick.law
